name: Build Argus IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Mac Üzerinde Derle
    runs-on: macos-14

    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Xcode Sürümünü Ayarla
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Gerekli Konfigürasyon Dosyasını Oluştur
        # Sorunu çözen satır burası! Derlemeden önce eksik dosyayı yaratıyoruz.
        run: cp Secrets.xcconfig.example Secrets.xcconfig

      - name: Uygulamayı Derle (İmzasız)
        run: |
          xcodebuild clean build \
            -project argus.xcodeproj \
            -scheme argus \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: IPA Formatına Çevir
        run: |
          mkdir Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Argus.ipa Payload

      - name: Çıktıyı Kullanıcıya Sun
        uses: actions/upload-artifact@v4
        with:
          name: Argus-IPA-Dosyasi
          path: Argus.ipa
